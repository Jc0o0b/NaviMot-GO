name: navimot_go
description: NaviMot GO - nawigacja i malownicze trasy motocyklowe z pogodą i miejscami dla motocyklisty.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  http: ^1.2.0
  provider: ^6.1.0
  geolocator: ^11.0.0
  intl: ^0.19.0
  shared_preferences: ^2.2.0
  flutter_tts: ^4.0.0
  image_picker: ^1.1.2
  cupertino_icons: ^1.0.6
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
