name: navimot_go
description: NaviMot GO - nawigacja i malownicze trasy motocyklowe z pogodą i miejscami dla motocyklisty.
publish_to: 'none'
version: 1.4.1+6

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  http: ^1.2.0
  provider: ^6.1.0
  geolocator: ^11.0.0
  intl: ^0.19.0
  shared_preferences: ^2.2.0
  flutter_tts: ^4.0.0
  image_picker: ^1.1.2
  cupertino_icons: ^1.0.6
  web: ^1.1.1
  url_launcher: ^6.3.0
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/montserrat-v31-latin_latin-ext-regular.ttf
          weight: 400
        - asset: assets/fonts/montserrat-v31-latin_latin-ext-500.ttf
          weight: 500
        - asset: assets/fonts/montserrat-v31-latin_latin-ext-600.ttf
          weight: 600
        - asset: assets/fonts/montserrat-v31-latin_latin-ext-700.ttf
          weight: 700
        - asset: assets/fonts/montserrat-v31-latin_latin-ext-800.ttf
          weight: 800
