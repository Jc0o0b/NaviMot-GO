<!DOCTYPE html>
<html>

    <meta name="theme-color" content="#FF5722">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="NaviMot GO">
    <meta name="description" content="NaviMot GO - nawigacja i malownicze trasy motocyklowe z pogodą i miejscami dla motocyklisty.">
    <title>NaviMot GO</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(180deg, #ffffff 0%, #ffe0b2 100%);
        z-index: 9999;
        font-family: system-ui, -apple-system, sans-serif;
      }
      #app-splash svg {
        width: 132px;
        height: 132px;
        animation: rev 1.1s ease-in-out infinite alternate;
      }
      .brand {
        margin-top: 18px;
        font-size: 26px;
        font-weight: 900;
        color: #263238;
        letter-spacing: 1px;
        opacity: 0;
        animation: fadeIn 0.7s ease-out 0.4s forwards;
      }
      .brand span { color: #FF5722; }
      @keyframes rev {
        from { transform: scale(0.94) rotate(-2deg); }
        to { transform: scale(1.05) rotate(2deg); }
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(14px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-splash svg { animation: none; }
      }
    </style>
  </head>

    <div id="app-splash">
